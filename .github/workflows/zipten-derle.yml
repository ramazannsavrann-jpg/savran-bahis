name: Zipten APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ZIP ac
        run: |
          # Son yüklenen ZIP seçilir (birden fazla ZIP olsa bile)
          ZIP=$(git diff --name-only HEAD~1 HEAD -- '*.zip' 2>/dev/null | head -n1)
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then ZIP=$(ls -1 *.zip | sort | tail -n1); fi
          echo "Kullanilan ZIP: $ZIP"
          mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj
          PROJ=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -n1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          ls "$PROJ"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Imza anahtari
        env:
          KS_B64: ${{ secrets.SAVRAN_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SAVRAN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/savran.jks"
            echo "SAVRAN_KEYSTORE=$RUNNER_TEMP/savran.jks" >> "$GITHUB_ENV"
            echo "SAVRAN_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "Sabit imza anahtari kullaniliyor (guncelleme uzerine kurulur)."
          else
            echo "UYARI: imza secret'lari yok; gecici debug imzasi kullanilacak (uzerine kurulum calismayabilir)."
          fi

      - name: APK derle
        run: |
          cd "$PROJ"
          gradle :app:assembleDebug --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1 || {
            echo "=== HATA OZETI ==="
            grep -E "^e: |What went wrong|Execution failed|error:" -A3 "$GITHUB_WORKSPACE/build.log" | head -120
            exit 1
          }
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/SavranAnaliz.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SavranAnaliz-apk
          path: out/*.apk

      - name: APK'yi apk dalina koy (Claude indirebilsin)
        continue-on-error: true
        run: |
          mkdir -p /tmp/apkrepo && cd /tmp/apkrepo
          git init -q && git checkout -q -b apk
          cp "$GITHUB_WORKSPACE/out/SavranAnaliz.apk" .
          git add SavranAnaliz.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "APK ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk

      - name: Testler (APK'yi engellemez)
        continue-on-error: true
        run: |
          cd "$PROJ"
          gradle :app:testDebugUnitTest --console=plain > "$GITHUB_WORKSPACE/test.log" 2>&1 && echo "=== TESTLER GECTI ===" || {
            echo "=== TEST HATA OZETI ==="
            grep -E "FAILED|Exception|expected|^e: " -A2 "$GITHUB_WORKSPACE/test.log" | head -80
            exit 1
          }
