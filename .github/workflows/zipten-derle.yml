name: Zipten APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP ac
        run: |
          mkdir -p /tmp/proj
          unzip -q "$(ls *.zip | head -n1)" -d /tmp/proj
          PROJ=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -n1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          ls "$PROJ"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK derle
        run: |
          cd "$PROJ"
          gradle :app:assembleDebug --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1 || {
            echo "=== HATA OZETI ==="
            grep -E "^e: |What went wrong|Execution failed|error:" -A3 "$GITHUB_WORKSPACE/build.log" | head -120
            exit 1
          }
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: SavranBahisTahmin-debug-apk
          path: out/*.apk
